<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Questão do Dia</title>
<meta name="description" content="Questões do Vestibulinho Etec para a Myrela, uma por dia.">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#F5F2EC; --paper:#FFFFFF; --ink:#1B1A18; --ink-2:#5E5A53; --ink-3:#9A958C;
  --line:#E4DFD5; --accent:#A4492B; --accent-soft:#F3E4DC; --ok:#2F6B4F; --ok-soft:#E1EEE6;
  --warn:#9A6A12; --warn-soft:#F5EBD3;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#161513; --paper:#201F1C; --ink:#EEEAE2; --ink-2:#B3ADA2; --ink-3:#7C776E;
  --line:#34322D; --accent:#E08A67; --accent-soft:#3A2820; --ok:#7FC3A0; --ok-soft:#1F3229;
  --warn:#E3B45A; --warn-soft:#3A2F17;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 120px}
button{font:inherit;color:inherit}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0}
h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.05;letter-spacing:-.01em;margin:8px 0 6px}
h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.15;margin:6px 0 4px}
.sub{color:var(--ink-2);margin:0}
.rule{height:1px;background:var(--line);margin:24px 0}

/* progresso */
.prog{display:flex;align-items:baseline;gap:12px;margin:28px 0 10px}
.prog .num{font-family:var(--serif);font-size:44px;line-height:1}
.prog .de{color:var(--ink-2)}
.bars{display:grid;grid-template-columns:1fr 1fr 5fr 1fr 1fr 5fr;gap:4px;height:8px}
.bars span{border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.bars span i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.legend{display:grid;grid-template-columns:1fr 1fr 5fr 1fr 1fr 5fr;gap:4px;font-size:10px;letter-spacing:.08em;color:var(--ink-3);margin-top:6px}

/* lista de dias */
.dias{list-style:none;margin:28px 0 0;padding:0;border-top:1px solid var(--line)}
.dia{display:flex;align-items:center;gap:16px;width:100%;padding:18px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.dia[disabled]{cursor:default;opacity:.5}
.dia .d{font-family:var(--serif);font-size:30px;line-height:1;width:44px}
.dia .info{flex:1;min-width:0}
.dia .nome{font-weight:600}
.dia .meta{font-size:14px;color:var(--ink-2)}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--line);color:var(--ink-2)}
.chip.hoje{background:var(--ink);color:var(--bg)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.pend{background:var(--warn-soft);color:var(--warn)}
.chip.atr{background:var(--accent-soft);color:var(--accent)}

/* tela do dia */
.topo{position:sticky;top:0;z-index:5;background:var(--bg);margin:-28px -20px 12px;padding:calc(10px + env(safe-area-inset-top)) 20px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.voltar{background:none;border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:var(--ink);cursor:pointer;font-size:15px;font-weight:600;min-height:44px}
.navdias{display:flex;gap:6px}
.navdias button{background:none;border:1px solid var(--line);border-radius:999px;width:44px;height:44px;color:var(--ink);cursor:pointer;font-size:16px}
.navdias button:disabled{opacity:.3;cursor:default}
.q{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-top:20px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:4px}
.qhead .n{font-family:var(--serif);font-size:22px}
.qhead .area{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.fonte{font-size:13px;color:var(--ink-3);margin:0 0 14px}
.texto{border-left:2px solid var(--line);padding:2px 0 2px 14px;margin:12px 0 16px;color:var(--ink);font-size:15.5px}
.texto p{margin:0 0 10px}
.texto figure{margin:10px 0}
.texto img{width:100%;height:auto;border-radius:8px;background:#fff}
details.texto summary{cursor:pointer;color:var(--ink-2);font-size:14px;list-style:none}
details.texto summary::before{content:"+ "}
details.texto[open] summary::before{content:"− "}
details.texto[open] summary{margin-bottom:10px}
.titulo-texto{font-family:var(--serif);font-size:18px}
.poema{font-family:var(--serif);font-size:17px;line-height:1.6}
.nota{font-size:13px;color:var(--ink-2)}
.mk{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin:0 1px;vertical-align:1px}
.lac{display:inline-block;min-width:56px;border-bottom:1.5px solid var(--ink);text-align:center;font-size:13px;color:var(--accent)}
.formula{font-family:var(--serif);font-size:20px;text-align:center;margin:12px 0}
.enun p{margin:0 0 10px}
.enun ul,.texto ul{margin:0 0 10px;padding-left:20px}
.tab{border-collapse:collapse;margin:8px auto 14px;font-variant-numeric:tabular-nums}
.tab th,.tab td{padding:6px 18px;border-bottom:1px solid var(--line);text-align:center}
.tab th{font-size:13px;color:var(--ink-2);font-weight:600}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.1;margin:0 2px}
.frac span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
.obs{font-size:13px;color:var(--ink-3);font-style:italic}

.alts{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.alt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:48px}
.alt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--ink-3);display:grid;place-items:center;font-weight:600;font-size:14px}
.alt .t{padding-top:2px}
.alt[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.alt[aria-pressed="true"] .l{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.alt:disabled{cursor:default}
.alt:focus-visible,.dia:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.barra{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(16px + env(safe-area-inset-bottom))}
.barra .in{max-width:640px;margin:0 auto}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-weight:600;font-size:16px;background:var(--ink);color:var(--bg);cursor:pointer}
.btn:disabled{background:var(--line);color:var(--ink-3);cursor:default}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.aviso{font-size:14px;color:var(--ink-2);text-align:center;margin:0 0 10px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.faixa{display:none;background:var(--warn-soft);color:var(--warn);font-size:14px;padding:10px 14px;border-radius:10px;margin-top:18px}
.faixa.on{display:block}
.instalar{display:none;margin-top:18px}
.instalar.on{display:block}
/* treino complementar */
.card-treino{display:flex;align-items:center;gap:16px;width:100%;margin-top:36px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--paper);text-align:left;cursor:pointer}
.card-treino .info{flex:1}
.card-treino .tit{font-family:var(--serif);font-size:22px;line-height:1.2}
.card-treino .meta{font-size:14px;color:var(--ink-2)}
.pdc{display:grid;gap:10px;margin:18px 0}
.pdc div{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.pdc b.big{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:400}
.pdc div.depois{opacity:.55}
.exemplo{border-left:2px solid var(--line);padding-left:14px;margin:12px 0;font-size:15px}
.exemplo p{margin:0 0 8px}
.sim{color:var(--ok);font-weight:600}.nao{color:var(--accent);font-weight:600}
.nivel{margin:28px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.tq .texto p:last-child{margin-bottom:0}
mark.marca{background:linear-gradient(transparent 6%,#FFE58A 6%,#FFE58A 96%,transparent 96%);color:#1B1A18;padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;font-weight:600}
.tarefa{background:var(--bg);border-radius:12px;padding:14px 16px;margin-top:4px}
.tarefa p{margin:4px 0 0}.tarefa .eyebrow{margin:0}
.alt.multi .l{border-radius:7px}
.alt.certa{border-color:var(--ok);background:var(--ok-soft)}
.alt.certa .l{background:var(--ok);border-color:var(--ok);color:#fff}
.alt.errada{border-color:var(--accent);background:var(--accent-soft)}
.alt.errada .l{background:var(--accent);border-color:var(--accent);color:#fff}
.porque{margin:6px 0 4px 42px;font-size:15px;color:var(--ink)}
.porque b{color:var(--accent)}
.fb{margin-top:18px;border-radius:12px;padding:16px 18px}
.fb.ok{background:var(--ok-soft)}.fb.ok .eyebrow{color:var(--ok)}
.fb.dica{background:var(--warn-soft)}.fb.dica .eyebrow{color:var(--warn)}
.fb p{margin:6px 0 0}
.fb .grande{font-family:var(--serif);font-size:22px;margin-top:2px}
.rod{margin-top:36px;font-size:12px;color:var(--ink-3)}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script src="questoes.js"></script>
<script src="treino.js"></script>
<script>
(function(){
  "use strict";
  var S = window.SEMANA, APP = document.getElementById("app");
  var params = new URLSearchParams(location.search);
  var PREVIEW = params.get("ver") === "tudo";
  // Pré-visualização guarda respostas à parte, para os testes não se misturarem com as reais.
  var KEY = "etec-" + S.id + (PREVIEW ? "-teste" : "");
  var deferredInstall = null;

  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {} }catch(e){ return {} } }
  function save(st){ try{ localStorage.setItem(KEY, JSON.stringify(st)) }catch(e){} }
  var st = load(); st.r = st.r || {}; st.env = st.env || {};

  function hojeISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
  function dm(iso){ var p=iso.split("-"); return p[2]+"/"+p[1] }
  var HOJE = hojeISO();
  var LETRAS = ["A","B","C","D","E"];

  function respondidas(dia){ return dia.q.filter(function(n){ return st.r[n] }).length }
  function liberado(dia){ return true } // todos os dias abertos (pedido da Lucia, 17/10)
  function status(dia){
    var tot=dia.q.length, r=respondidas(dia);
    if(st.env[dia.sig]) return {c:"ok", t:"Enviada"};
    if(!liberado(dia)) return {c:"", t:"Em breve"};
    if(r===tot) return {c:"pend", t:"Falta enviar"};
    if(dia.data===HOJE) return {c:"hoje", t:"Hoje"};
    if(dia.data<HOJE) return {c:"atr", t:"Atrasada"};
    return {c:"hoje", t:"Aberta"};
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]}) }

  function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on")},4200) }

  function pendentesEnvio(){ return S.dias.filter(function(d){ return !st.env[d.sig] && respondidas(d)===d.q.length }) }

  function home(){
    var total=0, feitas=0, bars="", leg="";
    S.dias.forEach(function(d){
      total+=d.q.length; var r=respondidas(d); feitas+=r;
      bars+='<span><i style="width:'+(100*r/d.q.length)+'%"></i></span>';
      leg+='<span>'+d.sig+'</span>';
    });
    var hoje = S.dias.filter(function(d){return d.data===HOJE})[0];
    var pend = pendentesEnvio();
    var html = '<p class="eyebrow">Myrela · Vestibulinho Etec</p>'
      + '<h1>Questão do dia</h1>'
      + '<p class="sub">'+esc(S.titulo)+' · '+dm(S.dias[0].data)+' a '+dm(S.dias[S.dias.length-1].data)+'</p>'
      + (PREVIEW?'<div class="faixa on">Modo de teste: todos os dias abertos e nada daqui vai para o app da aluna. <button class="btn sec" id="limpar" style="margin-top:10px">Apagar respostas de teste</button></div>':'')
      + '<div class="faixa'+(pend.length&&!PREVIEW?' on':'')+'">Você tem respostas guardadas que ainda não foram enviadas para o professor: '+pend.map(function(d){return d.nome}).join(", ")+'.</div>'
      + '<div class="instalar'+(deferredInstall?' on':'')+'" id="inst"><button class="btn sec" id="btnInst">Instalar o app no celular</button></div>'
      + '<div class="prog"><span class="num">'+feitas+'</span><span class="de">de '+total+' questões respondidas</span></div>'
      + '<div class="bars" aria-hidden="true">'+bars+'</div><div class="legend" aria-hidden="true">'+leg+'</div>'
      + '<ul class="dias">';
    S.dias.forEach(function(d){
      var s=status(d), n=d.q.length, r=respondidas(d);
      html += '<li><button class="dia" data-dia="'+d.sig+'"'+(liberado(d)?'':' disabled')+'>'
        + '<span class="d">'+d.data.slice(8)+'</span>'
        + '<span class="info"><span class="nome">'+d.nome+(d===hoje?' · hoje':'')+'</span><br>'
        + '<span class="meta">'+(n===1?'1 questão':n+' questões')+(r&&r<n?' · '+r+' respondida'+(r>1?'s':''):'')+'</span></span>'
        + '<span class="chip '+s.c+'">'+s.t+'</span></button></li>';
    });
    html += '</ul>' + cardTreino() + '<p class="rod">Questões oficiais do Vestibulinho Etec. Suas respostas ficam guardadas no celular, mesmo sem internet.</p>';
    APP.innerHTML = html;
    APP.querySelectorAll(".dia").forEach(function(b){ b.onclick=function(){ veioDaLista=true; location.hash=b.dataset.dia } });
    var ct=document.getElementById("cardTreino"); if(ct) ct.onclick=function(){ veioDaLista=true; location.hash="TREINO" };
    var bi=document.getElementById("btnInst"); if(bi) bi.onclick=instalar;
    var lp=document.getElementById("limpar"); if(lp) lp.onclick=function(){ st={r:{},env:{}}; save(st); home(); toast("Respostas de teste apagadas.") };
    window.scrollTo(0,0);
  }

  function diaView(sig){
    var dia=S.dias.filter(function(d){return d.sig===sig})[0];
    if(!dia || !liberado(dia)){ location.hash=""; return }
    var enviado=!!st.env[dia.sig], vistos={}, idx=S.dias.indexOf(dia), html='<div class="topo"><button class="voltar" id="voltar">← Todos os dias</button><span class="navdias"><button id="ant" aria-label="Dia anterior"'+(idx===0?' disabled':'')+'>‹</button><button id="prox" aria-label="Próximo dia"'+(idx===S.dias.length-1?' disabled':'')+'>›</button></span></div>'
      + '<p class="eyebrow">'+dia.nome+' · '+dm(dia.data)+'</p>'
      + '<h2>'+(dia.q.length===1?'Questão do dia':dia.q.length+' questões')+'</h2>'
      + '<p class="sub">'+(enviado?'Enviada para o professor. As respostas estão travadas.':'Escolha uma alternativa em cada questão.')+'</p>';
    dia.q.forEach(function(n,i){
      var q=S.questoes[n], tx="";
      if(q.texto){
        var corpo=S.textos[q.texto];
        if(vistos[q.texto]) tx='<details class="texto"><summary>Ver o texto novamente</summary>'+corpo+'</details>';
        else tx='<div class="texto"><p class="eyebrow" style="margin-bottom:8px">'+(q.texto==="poema"?"Leia o poema":"Leia o texto")+'</p>'+corpo+'</div>';
        vistos[q.texto]=1;
      }
      html += '<section class="q" aria-label="Questão '+(i+1)+'">'
        + '<div class="qhead"><span class="n">'+(dia.q.length>1?(i+1)+' de '+dia.q.length:'Questão')+'</span><span class="area">'+q.area+'</span></div>'
        + '<p class="fonte">'+S.prova+' · questão '+String(n).padStart(2,"0")+'</p>'
        + tx + '<div class="enun">'+q.enun+'</div>'
        + (q.obs?'<p class="obs">'+q.obs+'</p>':'')
        + '<ul class="alts">';
      q.alt.forEach(function(a,k){
        var L=LETRAS[k];
        html += '<li><button class="alt" data-q="'+n+'" data-l="'+L+'" aria-pressed="'+(st.r[n]===L)+'"'+(enviado?' disabled':'')+'><span class="l">'+L+'</span><span class="t">'+a+'</span></button></li>';
      });
      html += '</ul></section>';
    });
    var r=respondidas(dia), tot=dia.q.length;
    html += '<div class="barra"><div class="in">'
      + '<p class="aviso" id="aviso">'+(enviado?'Enviada em '+new Date(st.env[dia.sig]).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):(r<tot?'Faltam '+(tot-r)+' de '+tot:'Tudo respondido. Agora é só enviar.'))+'</p>'
      + '<button class="btn" id="enviar"'+(r<tot?' disabled':'')+'>'+(enviado?'Enviar de novo':'Enviar para o professor')+'</button>'
      + '</div></div>';
    APP.innerHTML=html;
    document.getElementById("voltar").onclick=voltar;
    document.getElementById("ant").onclick=function(){ if(idx>0) location.replace("#"+S.dias[idx-1].sig) };
    document.getElementById("prox").onclick=function(){ if(idx<S.dias.length-1) location.replace("#"+S.dias[idx+1].sig) };
    APP.querySelectorAll(".alt").forEach(function(b){
      b.onclick=function(){
        var n=b.dataset.q; st.r[n]=b.dataset.l; save(st);
        APP.querySelectorAll('.alt[data-q="'+n+'"]').forEach(function(x){ x.setAttribute("aria-pressed", String(x===b)) });
        var r2=respondidas(dia); document.getElementById("enviar").disabled = r2<tot;
        document.getElementById("aviso").textContent = r2<tot ? 'Faltam '+(tot-r2)+' de '+tot : 'Tudo respondido. Agora é só enviar.';
      };
    });
    document.getElementById("enviar").onclick=function(){ enviar(dia) };
    window.scrollTo(0,0);
  }

  function mensagem(dia){
    var linhas=["Myrela · Etec · "+dia.nome+" "+dm(dia.data)];
    dia.q.forEach(function(n,i){ linhas.push((dia.q.length>1?(i+1)+") ":"")+"Questão "+String(n).padStart(2,"0")+": "+st.r[n]) });
    linhas.push("Código: "+S.id+"-"+dia.sig+"-"+dia.q.map(function(n){return st.r[n]}).join(""));
    return linhas.join("\n");
  }

  function enviar(dia){
    if(PREVIEW){ toast("Modo de teste: o envio só funciona no link normal da aluna."); return; }
    if(!navigator.onLine){
      toast("Sem internet agora. Suas respostas estão guardadas no celular. Quando a internet voltar, toque em Enviar.");
      return;
    }
    var url="https://wa.me/?text="+encodeURIComponent(mensagem(dia));
    st.env[dia.sig]=Date.now(); save(st);
    window.open(url,"_blank") || (location.href=url);
    diaView(dia.sig);
    toast("Abrindo o WhatsApp. Escolha o professor e toque em enviar.");
  }

  // ---------- Exercício complementar: treino de interpretação ----------
  var T = window.TREINO, TKEY = "etec-treino-" + T.id + (PREVIEW ? "-teste" : "");
  function tload(){ try{ return JSON.parse(localStorage.getItem(TKEY)) || {} }catch(e){ return {} } }
  var ts = tload(); ts.q = ts.q || {};
  function tsave(){ try{ localStorage.setItem(TKEY, JSON.stringify(ts)) }catch(e){} }
  function tq(n){ return T.q.filter(function(x){ return x.n===n })[0] }
  function tst(n){ return ts.q[n] = ts.q[n] || {tent:[], fim:false, sel:[]} }
  function feitas(){ return T.q.filter(function(x){ return ts.q[x.n] && ts.q[x.n].fim }).length }
  var MAXT = 3; // na 3ª tentativa errada, mostra a resposta

  function cardTreino(){
    var f=feitas();
    return '<button class="card-treino" id="cardTreino"><span class="info"><span class="eyebrow">Exercício complementar</span><br><span class="tit">'+T.titulo+'</span><br>'
      + '<span class="meta">10 questões · sem fazer contas · '+(f?f+' de 10 feitas':'a explicação aparece na hora')+'</span></span>'
      + '<span class="chip '+(ts.env?'ok':f===10?'pend':'hoje')+'">'+(ts.env?'Enviado':f===10?'Falta enviar':'Abrir')+'</span></button>';
  }

  function statusT(x){
    var s=ts.q[x.n];
    if(!s || !s.tent.length) return {c:"", t:"A fazer"};
    if(!s.fim) return {c:"pend", t:"Tentando"};
    if(s.tent[s.tent.length-1].join("")===x.certo) return {c:"ok", t: s.tent.length===1?"De primeira":"Acertou na "+s.tent.length+"ª"};
    return {c:"atr", t:"Ver de novo"};
  }

  function treinoHome(){
    var html='<div class="topo"><button class="voltar" id="voltar">← Início</button></div>'
      + '<p class="eyebrow">Exercício complementar</p><h2>'+T.titulo+'</h2>'
      + '<p class="sub">Estes exercícios não são de provas oficiais da Etec. Eles treinam uma coisa muito importante: ler, entender o que a questão pergunta e escolher só os números que servem.</p>'
      + '<div class="pdc"><div><b class="big">P</b><span><b>Pergunta.</b> O que eu preciso descobrir?</span></div>'
      + '<div><b class="big">D</b><span><b>Dados.</b> Quais números ajudam a responder? Alguns números estão no texto só para distrair.</span></div>'
      + '<div class="depois"><b class="big">C</b><span><b>Conta.</b> Fica para depois. Hoje, nada de contas!</span></div></div>'
      + '<details class="texto"><summary>Ver o exemplo</summary><div class="exemplo">'
      + '<p>Uma escola tem 450 alunos, distribuídos em 15 salas de aula. Uma professora comprou 6 caixas de lápis por R$ 48,00. Cada caixa contém 12 lápis.</p>'
      + '<p><b>Pergunta:</b> quanto ela pagaria por 10 caixas?</p>'
      + '<p>450 alunos? <span class="nao">Não.</span> 15 salas? <span class="nao">Não.</span> 12 lápis por caixa? <span class="nao">Não.</span><br>6 caixas por R$ 48,00? <span class="sim">Sim.</span> 10 caixas? <span class="sim">Sim.</span></p>'
      + '<p>Os três números: <b>6 caixas, R$ 48,00 e 10 caixas.</b></p></div></details>'
      + '<p class="sub" style="margin-top:14px">Em cada questão, a pergunta vem <mark class="marca">marcada em amarelo</mark>. Escolha os <b>3 números que você usaria na conta</b> e toque em Conferir. Se errar, aparece uma explicação e você tenta de novo.</p>';
    var nv=0;
    T.q.forEach(function(x){
      if(x.nivel!==nv){ if(nv) html+='</ul>'; nv=x.nivel; html+='<p class="nivel">'+T.niveis[nv]+'</p><ul class="dias" style="margin-top:8px">' }
      var s=statusT(x);
      html+='<li><button class="dia" data-t="'+x.n+'"><span class="d">'+x.n+'</span><span class="info"><span class="nome">'+x.nome+'</span></span><span class="chip '+s.c+'">'+s.t+'</span></button></li>';
    });
    var f=feitas();
    html+='</ul><div style="height:24px"></div><div class="barra"><div class="in"><p class="aviso">'+(ts.env?'Enviado em '+new Date(ts.env).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):f+' de 10 feitas')+'</p>'
      + '<button class="btn" id="tenviar"'+(f?'':' disabled')+'>'+(ts.env?'Enviar de novo':'Enviar para o professor')+'</button></div></div>';
    if(PREVIEW) html+='<button class="btn sec" id="tlimpar">Apagar respostas de teste do treino</button>';
    APP.innerHTML=html;
    document.getElementById("voltar").onclick=voltar;
    APP.querySelectorAll(".dia").forEach(function(b){ b.onclick=function(){ location.hash="T"+b.dataset.t } });
    document.getElementById("tenviar").onclick=enviarTreino;
    var tl=document.getElementById("tlimpar"); if(tl) tl.onclick=function(){ ts={q:{}}; tsave(); treinoHome(); toast("Respostas de teste do treino apagadas.") };
    window.scrollTo(0,0);
  }

  function treinoQ(n){
    var x=tq(n); if(!x){ location.replace("#TREINO"); return }
    var s=tst(n), i=T.q.indexOf(x), ult=s.tent[s.tent.length-1], conferido=!!s.conf || s.fim;
    var sel = s.fim ? ult : s.sel, acertou = s.fim && ult.join("")===x.certo, revelou = s.fim && !acertou;
    var html='<div class="topo"><button class="voltar" id="voltar">← Treino</button><span class="navdias"><button id="ant" aria-label="Questão anterior"'+(i===0?' disabled':'')+'>‹</button><button id="prox" aria-label="Próxima questão"'+(i===T.q.length-1?' disabled':'')+'>›</button></span></div>'
      + '<p class="eyebrow">'+T.niveis[x.nivel]+'</p><h2>'+x.n+'. '+x.nome+'</h2>'
      + '<section class="q tq"><div class="texto">'+x.texto.map(function(p,k){ return '<p>'+(k===x.texto.length-1?'<mark class="marca">'+esc(p)+'</mark>':esc(p))+'</p>' }).join("")+'</div>'
      + '<div class="tarefa"><p class="eyebrow">Sua tarefa</p><p>Para responder a <mark class="marca">pergunta amarela</mark>, alguém teria que fazer uma conta.</p><p>Você <b>não vai fazer a conta</b>. Você só vai escolher os <b>3 números que entrariam nessa conta</b>. Os outros números estão no texto só para confundir.</p></div><ul class="alts">';
    x.alt.forEach(function(a,k){
      var L=LETRAS7[k], on=sel.indexOf(L)>=0, cls="";
      if(conferido && on) cls = x.certo.indexOf(L)>=0 ? " certa" : " errada";
      if(revelou && !on && x.certo.indexOf(L)>=0) cls=" certa";
      html+='<li><button class="alt multi'+cls+'" data-l="'+L+'" aria-pressed="'+on+'"'+(conferido?' disabled':'')+'><span class="l">'+L+'</span><span class="t">'+esc(a)+'</span></button>';
      if(conferido && on && x.certo.indexOf(L)<0) html+='<p class="porque"><b>Por que não?</b> '+esc(x.por[L])+'</p>';
      html+='</li>';
    });
    html+='</ul>';
    if(conferido){
      if(acertou) html+='<div class="fb ok"><p class="eyebrow">'+(s.tent.length===1?'Acertou de primeira':'Agora sim')+'</p><p class="grande">Isso! Você achou os 3 números.</p><p>'+esc(x.resumo)+'</p></div>';
      else if(revelou) html+='<div class="fb dica"><p class="eyebrow">Os números certos são '+x.certo.split("").join(", ")+'</p><p>'+esc(x.resumo)+'</p><p><b>Para a próxima:</b> '+esc(x.pense)+'</p></div>';
      else { var bons=ult.filter(function(L){ return x.certo.indexOf(L)>=0 }).length;
        html+='<div class="fb dica"><p class="eyebrow">Pense assim</p><p>'+(bons?'Você já acertou '+(bons===1?'1 número':bons+' números')+' (os verdes). Troque '+(3-bons===1?'o vermelho':'os vermelhos')+'.':'Nenhum desses números serve. Leia a pergunta de novo, com calma.')+'</p><p>'+esc(x.pense)+'</p></div>'; }
    }
    html+='</section><div style="height:24px"></div><div class="barra"><div class="in">';
    if(!conferido) html+='<p class="aviso" id="aviso">'+avisoSel(sel.length)+'</p><button class="btn" id="conferir"'+(sel.length===3?'':' disabled')+'>Conferir</button>';
    else if(!s.fim) html+='<p class="aviso">Tentativa '+s.tent.length+' de '+MAXT+'</p><button class="btn" id="denovo">Tentar de novo</button>';
    else html+= i<T.q.length-1 ? '<button class="btn" id="seguir">Próxima questão</button>' : '<button class="btn" id="seguir">Terminar e enviar</button>';
    html+='</div></div>';
    APP.innerHTML=html;
    document.getElementById("voltar").onclick=function(){ location.replace("#TREINO") };
    document.getElementById("ant").onclick=function(){ if(i>0) location.replace("#T"+T.q[i-1].n) };
    document.getElementById("prox").onclick=function(){ if(i<T.q.length-1) location.replace("#T"+T.q[i+1].n) };
    APP.querySelectorAll(".alt").forEach(function(b){ b.onclick=function(){
      var L=b.dataset.l, k=s.sel.indexOf(L);
      if(k>=0) s.sel.splice(k,1); else { if(s.sel.length>=3){ toast("Já tem 3 letras. Toque em uma para tirar."); return } s.sel.push(L) }
      s.sel.sort(); tsave();
      b.setAttribute("aria-pressed", String(s.sel.indexOf(L)>=0));
      document.getElementById("conferir").disabled = s.sel.length!==3;
      document.getElementById("aviso").textContent = avisoSel(s.sel.length);
    }});
    var c=document.getElementById("conferir"); if(c) c.onclick=function(){
      s.tent.push(s.sel.slice()); s.conf=true; if(s.sel.join("")===x.certo || s.tent.length>=MAXT) s.fim=true; delete ts.env; tsave(); treinoQ(n);
    };
    var d=document.getElementById("denovo"); if(d) d.onclick=function(){ s.conf=false; s.sel=s.sel.filter(function(L){ return x.certo.indexOf(L)>=0 }); tsave(); treinoQ(n) };
    var g=document.getElementById("seguir"); if(g) g.onclick=function(){ location.replace(i<T.q.length-1 ? "#T"+T.q[i+1].n : "#TREINO") };
    var porq=APP.querySelector(".porque, .fb");
    if(conferido && porq) porq.scrollIntoView({block:"center"}); else window.scrollTo(0,0);
  }
  var LETRAS7 = ["A","B","C","D","E","F","G"];
  function avisoSel(k){ return k===3 ? "Pronto. Toque em Conferir." : "Escolha "+(3-k)+(3-k===1?" letra":" letras")+(k?" (já tem "+k+")":"") }

  function mensagemTreino(){
    var linhas=["Myrela · "+T.titulo], prim=0;
    T.q.forEach(function(x){
      var s=ts.q[x.n]; if(!s || !s.fim) { linhas.push(x.n+" — não fez"); return }
      var t=s.tent, ok=t[t.length-1].join("")===x.certo; if(ok && t.length===1) prim++;
      linhas.push(x.n+" — "+t[0].join(", ")+(ok ? (t.length===1?" ✓ de primeira":" · acertou na "+t.length+"ª tentativa") : " · errou "+t.length+" vezes ("+t.map(function(a){return a.join("")}).join(" / ")+")"));
    });
    linhas.push("Feitas: "+feitas()+" de 10 · de primeira: "+prim);
    return linhas.join("\n");
  }
  function enviarTreino(){
    if(PREVIEW){ toast("Modo de teste: o envio só funciona no link normal da aluna."); return }
    if(!navigator.onLine){ toast("Sem internet agora. Suas respostas estão guardadas. Quando a internet voltar, toque em Enviar."); return }
    var url="https://wa.me/?text="+encodeURIComponent(mensagemTreino());
    ts.env=Date.now(); tsave();
    window.open(url,"_blank") || (location.href=url);
    treinoHome(); toast("Abrindo o WhatsApp. Escolha o professor e toque em enviar.");
  }

  function instalar(){
    if(!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(function(){ deferredInstall=null; var e=document.getElementById("inst"); if(e) e.classList.remove("on") });
  }
  window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); deferredInstall=e; var el=document.getElementById("inst"); if(el) el.classList.add("on") });
  window.addEventListener("online",function(){ if(pendentesEnvio().length) toast("A internet voltou. Você tem respostas para enviar ao professor.") });

  // Voltar: usa o histórico quando a aluna veio da lista (o botão voltar do Android faz o mesmo).
  var veioDaLista=false;
  function voltar(){ if(veioDaLista){ veioDaLista=false; history.back() } else location.replace("#") }
  function rota(){ var h=location.hash.slice(1); if(h==="TREINO") treinoHome(); else if(/^T\d+$/.test(h)) treinoQ(+h.slice(1)); else if(h) diaView(h); else home() }
  window.addEventListener("hashchange",rota);
  rota();

  if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js") }) }
})();
</script>
</body>
</html>
